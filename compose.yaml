# Development container (docs/environment.md). Run every npm / cargo / tauri
# command inside this service; nothing is installed on the host.
services:
  dev:
    build:
      context: docker/dev
    image: design-dawn-dev:local
    working_dir: /workspace
    # Keeps the container alive for `docker compose exec`; one-off commands can
    # still use `docker compose run --rm dev <cmd>`.
    command: sleep infinity
    init: true
    volumes:
      - .:/workspace
      # Heavy directories live on named volumes because bind-mount I/O from
      # Windows is slow.
      - node_modules:/workspace/node_modules
      - cargo_target:/workspace/src-tauri/target
      - cargo_registry:/home/dev/.cargo/registry
      - cargo_git:/home/dev/.cargo/git
      - npm_cache:/home/dev/.npm
      # WSLg sockets (Docker Desktop exposes them under /run/desktop/mnt/host/wslg).
      - /run/desktop/mnt/host/wslg/.X11-unix:/tmp/.X11-unix
      - /run/desktop/mnt/host/wslg:/mnt/wslg
    environment:
      DISPLAY: ":0"
      WAYLAND_DISPLAY: wayland-0
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      PULSE_SERVER: /mnt/wslg/PulseServer
      # WebKitGTK window display is verified via WSLg's X11 (XWayland) only;
      # the native Wayland path is unverified, so force X11 for predictability.
      GDK_BACKEND: x11
      # The bind-mounted repo comes from Windows, where inotify events may not
      # arrive, so Vite must poll for file changes.
      DAWN_WATCH_POLLING: "true"

volumes:
  node_modules:
  cargo_target:
  cargo_registry:
  cargo_git:
  npm_cache:
