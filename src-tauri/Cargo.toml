[package]
name = "design-dawn"
version = "0.1.0"
description = "Design Dawn desktop design document application"
edition = "2021"
publish = false
# `design-dawn-mcp` is a second binary; `cargo run` and the Tauri CLI mean the app.
default-run = "design-dawn"

[lib]
name = "design_dawn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
imagesize = "0.15"
uuid = { version = "1", features = ["v7"] }
# File watching for external changes. CC0-1.0.
notify = "=8.2.0"

# Desktop only: the plugin has no mobile implementation. A second launch is handed to the
# running instance instead of opening a second process on the same Project files.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
# `tauri::test` (mock runtime) for the command-boundary integration tests only. Cargo's
# resolver 2 keeps dev-dependency features out of normal and release builds.
tauri = { version = "2", features = ["test"] }
