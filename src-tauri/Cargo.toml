[package]
name = "design-dawn"
version = "0.1.0"
description = "Design Dawn desktop design document application"
edition = "2021"
publish = false

[lib]
name = "design_dawn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
serde_json = "1"
