# Third-party license policy for the Rust side of the shipped application.
# Used by `npm run licenses:generate` / `licenses:check` (scripts/third-party-notices.mjs).
# See docs/oss-policy.md section 5.1 and docs/dependencies.md.

# Only permissive licenses are accepted globally (docs/oss-policy.md section 2).
# Any other license makes cargo-about fail, so a new dependency with an unreviewed
# license can never slip into THIRD_PARTY_NOTICES.md silently.
accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MIT-0",
  # ISC (functionally equivalent to MIT; docs/oss-policy.md): inotify and inotify-sys, pulled
  # in by notify (Phase 7, user delegation 2026-10-30).
  "ISC",
]

# Desktop targets we ship, so Windows- and macOS-only crates are covered even when the
# command runs on Linux.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

# Dev-dependencies (tauri "test" feature etc.) are not part of the shipped binary.
ignore-dev-dependencies = true
# Build scripts do not end up in the shipped binary either. Note that cargo-about still
# reports proc-macro crates (they are "normal" edges in Cargo's graph), so the notice may
# list a few compile-time-only crates; over-reporting is the safe direction.
ignore-build-dependencies = true

# The application crate itself (publish = false, no license decided yet) is not third-party.
private = { ignore = true }

# MPL-2.0 (weak, file-level copyleft) is NOT accepted globally. It is accepted per crate
# below for these five crates only (user decision, 2026-10-11). They are used unmodified;
# THIRD_PARTY_NOTICES.md lists their exact versions with the crates.io source archives.
# A new MPL-2.0 crate is not covered and makes the command fail until it is reviewed.
#   option-ext   : shipped (dirs-sys -> tauri), used unmodified
#   cssparser, cssparser-macros, selectors, dtoa-short : reachable only through
#                  tauri-utils' build-time HTML processing (proc-macro side); not linked
#                  into the app binary (verified with `cargo tree -e no-proc-macro,...`).
[option-ext]
accepted = ["MPL-2.0"]

[cssparser]
accepted = ["MPL-2.0"]

[cssparser-macros]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]
